<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D2E67">
<meta name="robots" content="noindex">
<title>叫號說・櫃台叫號台</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Archivo+Black&display=swap">
<style>
:root{--sky:#5B5BA5;--night:#2D2E67;--ink:#2D2E67;--paper:#FFFFFF;--cream:#F6F6F9;--orange:#E8893A;--yellow:#F5C543;--green:#4BA882;--red:#DD4F3C;--lilac:#D9D9EE;--muted:#5a5c78;
  --f:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;--fn:"Archivo Black","Noto Sans TC",Impact,sans-serif;--line:3px solid var(--ink);--sh:3px 3px 0 var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
.top h1{margin:0;font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-size:12px;color:var(--yellow);font-weight:700;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;border-radius:999px;padding:2px 10px;background:#2a2947;color:#fff;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#888}
.pill.live i{background:var(--green)}.pill.bad i{background:var(--red)}.pill.wait i{background:var(--yellow)}
.topbtn{border:2px solid var(--yellow);background:var(--yellow);color:var(--ink);border-radius:999px;font-weight:900;font-size:13px;padding:3px 12px;white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:860px){.wrap.main{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.wrap.main .full{grid-column:1/-1}}
.box{background:var(--paper);border:var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px;display:grid;gap:10px;min-width:0}
.box h2{margin:0;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px;margin:0}
.tag{display:inline-block;font-size:12px;font-weight:900;padding:0 8px;border-radius:6px;border:2px solid var(--ink);background:var(--yellow);white-space:nowrap}
.tag.blue{background:var(--sky);color:#fff}.tag.green{background:var(--green)}.tag.lilac{background:var(--lilac)}.tag.white{background:#fff}.tag.red{background:var(--red);color:#fff}
.btn{border:var(--line);background:#fff;font-weight:900;padding:8px 14px;border-radius:12px;box-shadow:2px 2px 0 var(--ink);font-size:15px;text-decoration:none;display:inline-block;text-align:center;color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--yellow)}.btn.sm{font-size:13px;padding:4px 10px}.btn.wide{width:100%}.btn.warn{background:#ffd9d3}
.btn:active,.cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled,.cta:disabled{opacity:.45;cursor:not-allowed}
.cta{width:100%;border:var(--line);border-radius:18px;background:var(--yellow);box-shadow:5px 5px 0 var(--ink);font-weight:900;font-size:26px;padding:16px 12px;line-height:1.2;display:grid;gap:2px}
.cta small{font-size:14px;font-weight:700}
.cta b{font-family:var(--fn);font-weight:400}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:var(--line);border-radius:12px;background:#fff;font-weight:900;padding:8px 4px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.seg button small{display:block;font-size:11px;font-weight:700;opacity:.8;font-family:var(--fn)}
.now{background:var(--orange);color:#fff}
.now .no{font-family:var(--fn);font-size:64px;line-height:1;text-shadow:3px 3px 0 var(--ink)}
.now h2{color:#fff}
.say{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-weight:700;overflow-wrap:anywhere}
.say small{display:block;font-size:11px;color:var(--muted);font-weight:900}
.say.none{background:transparent;border-style:dashed;color:inherit;font-weight:500;opacity:.9}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;border-top:2px dashed #d8d4c8;padding-top:10px}
.q:first-of-type{border-top:0;padding-top:0}
.q .n{font-family:var(--fn);font-size:22px;line-height:1}
.q .n small{display:block;font-family:var(--f);font-size:11px;color:var(--muted);font-weight:700}
.q .t{grid-column:1/-1;font-size:14px;font-weight:700;background:#f4f1e6;border-radius:8px;padding:4px 8px;overflow-wrap:anywhere}
.q .t.none{background:none;padding:0;color:var(--muted);font-weight:500;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 4px}
.stats b{display:block;font-family:var(--fn);font-size:24px;line-height:1.1;font-weight:400}
.stats span{font-size:12px;font-weight:700;color:var(--muted)}
.desks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.desks div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px;text-align:center;font-size:12px;font-weight:700}
.desks b{display:block;font-family:var(--fn);font-size:20px;font-weight:400}
label.f{display:grid;gap:4px;font-weight:900;font-size:14px}
input[type=text],input[type=url],input[type=password]{border:var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
.err{color:var(--red);font-weight:900;font-size:14px;min-height:1.3em;white-space:pre-line}
.steps{margin:0;padding-left:1.3em;font-size:14px;display:grid;gap:4px}
/* 場次面板 */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(13,18,64,.78);display:grid;place-items:center;padding:14px}
#sheet[hidden]{display:none}
#sheet .in{width:min(100%,620px);max-height:100%;overflow:auto;background:var(--paper);border:var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:16px;display:grid;gap:14px}
.qrbox{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center}
.qrbox .qr{width:132px;height:132px;border:var(--line);border-radius:12px;overflow:hidden;background:#fff}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox h3{margin:0;font-size:16px;font-weight:900}
.sec{border-top:2px dashed #d8d4c8;padding-top:12px;display:grid;gap:8px}
.ai{border:2px solid var(--ink);border-radius:12px;background:#eef0ff;padding:6px 10px;display:grid;gap:3px;font-size:13px;color:var(--ink)}
.ai small{font-size:11px;font-weight:900;color:#4a52a8}
.ai b{font-size:14px}
.ai.big{font-size:14px}.ai.big b{font-size:16px}
.q .ai{grid-column:1/-1}
.diff{font-size:11px;font-weight:900;color:#a3200f}.diff.ok{color:#1d7a40}
.confirm{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:10px;display:grid;gap:8px}
.confirm small{color:var(--muted);font-size:12px;margin-top:-6px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cgrid .btn{white-space:normal;line-height:1.3}
.acc h2{font-size:16px}
#flash{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;font-weight:900;border-radius:999px;padding:8px 18px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:92vw;text-align:center}
#flash[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 叫號說新配色：取自台灣大哥大 logo（深藏青 #2D2E67、紫藍 #5B5BA5、暖橘 #E8893A、金黃 #F5C543、紅橘 #DD4F3C、綠 #4BA882）。舊版：git tag pre-palette-v3 ===== */
.li{width:1.1em;height:1.1em;vertical-align:-.18em}.li .ac{stroke:#E8893A}

/* 櫃台：淺灰底、深藏青標題列＋logo 五色細線、細框柔和陰影 */
body{background:#F2F2F7!important}
.top{background:#2D2E67!important;box-shadow:inset 0 -4px 0 0 transparent;border-bottom:4px solid transparent;border-image:linear-gradient(90deg,#F5C543 0 25%,#E8893A 25% 50%,#DD4F3C 50% 62%,#5B5BA5 62% 82%,#4BA882 82% 100%) 1}
.box{border:1.5px solid #DEDEEA!important;box-shadow:0 6px 20px rgba(45,46,103,.08)!important;border-radius:20px}
</style>
<script>/* ===== SVG 線稿圖示（2px、圓角、深藏青＋橘色重點） ===== */
(function(){
const P={
 ticket:'<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M15 6v12" stroke-dasharray="2 2"/><path d="M7 10.5h5M7 13.5h3" class="ac"/>',
 phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><path d="M9.5 8h5M9.5 11h3.5" class="ac"/>',
 pin:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.4" class="ac"/>',
 clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2" class="ac"/>',
 smile:'<circle cx="12" cy="12" r="8.5"/><path d="M8.5 14c.9 1.4 2.1 2 3.5 2s2.6-.6 3.5-2" class="ac"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/>',
 chat:'<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/><path d="M8.5 10h.01M12 10h.01M15.5 10h.01" stroke-width="2.6" class="ac"/>',
 clip:'<rect x="5" y="4.5" width="14" height="16.5" rx="2"/><path d="M9 4.5V3.5h6v1"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4" class="ac"/>',
 bell:'<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0" class="ac"/>',
 timer:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 3h4" class="ac"/>',
 coin:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="16" cy="14.5" r="1.6" class="ac"/>',
 renew:'<path d="M19.5 12a7.5 7.5 0 0 1-13 5.1M4.5 12a7.5 7.5 0 0 1 13-5.1"/><path d="M17.5 3.5v3.4h-3.4M6.5 20.5v-3.4h3.4" class="ac"/>',
 wrench:'<path d="M14.5 4.5a4.5 4.5 0 0 0-4.3 5.8L4 16.5 7.5 20l6.2-6.2a4.5 4.5 0 0 0 5.8-4.3l-2.6 2.6-3-.6-.6-3z"/>',
 box:'<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/><path d="M7.8 5.3l8.5 4.5" class="ac"/>',
 lock:'<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.5v2.5" class="ac"/>',
 info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5" class="ac"/><path d="M12 7.8h.01" stroke-width="2.8"/>'
};
const sv=(k,cls)=>`<svg class="li ${cls||""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
window.__LI=sv;
const EMO={"📋":"clip","🔔":"bell","📍":"pin","⏱":"timer","⏱️":"timer","🔒":"lock","📩":"chat","⏰":"clock","🏪":"pin","💡":"info","📊":"info"};
const re=new RegExp("("+Object.keys(EMO).map(e=>e.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\uFE0F?","g");
function swap(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&!n.parentElement.closest("script,style,textarea,svg")&&re.test(n.nodeValue)?1:2});const L=[];let n;while((n=w.nextNode()))L.push(n);
  L.forEach(t=>{re.lastIndex=0;const span=document.createElement("span");span.innerHTML=t.nodeValue.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(re,m=>sv(EMO[m.replace(/️/,"")]||"info","inl"));t.replaceWith(...span.childNodes)})}
const CAT={"繳費":"coin","續約":"renew","異動":"wrench","網路取貨":"box"};
function cats(root){root.querySelectorAll(".cat[data-c],.cats button[data-c]").forEach(b=>{if(b.querySelector(".li"))return;const k=Object.keys(CAT).find(x=>(b.dataset.c||"").startsWith(x));if(k)b.insertAdjacentHTML("afterbegin",sv(CAT[k],"cat-i"))})}
function run(){swap(document.body);cats(document)}
new MutationObserver(()=>{mo.disconnect();run();mo.observe(document.body,{subtree:true,childList:true})}).observe;
const mo=new MutationObserver(()=>{mo.disconnect();try{run()}catch(e){}mo.observe(document.body,{subtree:true,childList:true})});
addEventListener("DOMContentLoaded",()=>{run();mo.observe(document.body,{subtree:true,childList:true})});
})();
</script>

<body>
<header class="top">
  <h1>叫號說<small id="storeName">櫃台叫號台</small></h1>
  <span class="pill wait" id="status" hidden><i></i><span>連線中…</span></span>
  <button class="topbtn" id="sessBtn" hidden>場次・QR Code</button>
</header>
<main id="app"></main>
<div id="sheet" hidden></div>
<div id="flash" hidden role="status"></div>

<script src="qrcode.js"></script>
<script src="live.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const Q=window.QTLive;
const CATS={"繳費/儲值":"green","續約/換約/新申辦":"","異動/諮詢/維修":"blue","網路取貨/預約取件":"lilac"};
const PREP={"繳費/儲值":"門號或帳單","續約/換約/新申辦":"身分證、第二證件、原門號 SIM 卡（續約時）","異動/諮詢/維修":"身分證、要維修的手機（維修時）","網路取貨/預約取件":"身分證、取貨簡訊或訂單編號"};
const LANGS={en:"English",ja:"日本語",ko:"한국어",vi:"Tiếng Việt",id:"Bahasa Indonesia"};
const SAMPLE=[["續約/換約/新申辦","合約下個月到期，想看看有沒有比較便宜的 5G 方案"],["異動/諮詢/維修","螢幕摔破了，想問維修大概要多久"],["繳費/儲值",""],["網路取貨/預約取件","上週網路訂的手機，來取貨"],["續約/換約/新申辦","幫爸爸續約，想換大字的手機"],["異動/諮詢/維修","出國要用的上網方案怎麼選"]];
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let sess=null,conn=null,V=Q.view(null),desk=+(ls.get("qt-live-desk")||1),busy=false;
const plain=new Map();   // 票 id → 解開後的留言

function flash(msg,ms){const f=$("#flash");f.textContent=msg;f.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>f.hidden=true,ms||2600)}
function setStatus(s){const p=$("#status");p.hidden=false;p.className="pill "+(s==="live"?"live":s==="connecting"||s==="reconnecting"?"wait":"bad");p.lastElementChild.textContent=Q.STATUS_ZH[s]||s}
const tagOf=c=>`<span class="tag ${CATS[c]||""}">${esc(c)}</span>`;
const mins=t=>t.t?Math.max(0,Math.round((Date.now()-t.t)/60000)):0;
const errText=e=>e&&(e.status===401||e.status===403)?"資料庫拒絕寫入。\n請到 Firebase 的「規則」分頁，確認已貼上安全規則並按「發布」。":e&&e.status===404?"找不到這個資料庫，請確認網址是從 Firebase「即時資料庫」頁面複製的。":"連不上資料庫，請檢查網路，或確認資料庫網址沒有貼錯。";

/* ================= 建立場次 ================= */
function renderSetup(msg){
  $("#sessBtn").hidden=true;$("#status").hidden=true;$("#storeName").textContent="櫃台叫號台";
  $("#app").innerHTML=`<div class="wrap" style="max-width:620px">
    <div class="box"><h2>建立現場場次</h2>
      <p class="muted">建立後，這台裝置就是櫃台。再用「場次・QR Code」開啟門市大螢幕，顧客掃大螢幕上的 QR Code 就能取號。</p>
      <label class="f">Firebase 資料庫網址<input type="url" id="host" inputmode="url" autocomplete="off" placeholder="https://你的專案-default-rtdb.asia-southeast1.firebasedatabase.app" value="${esc(ls.get("qt-live-host")||"")}"></label>
      <label class="f">門市名稱<input type="text" id="store" maxlength="12" value="${esc(ls.get("qt-live-store")||"台北文創門市")}"></label>
      <div class="err" id="err">${esc(msg||"")}</div>
      <button class="cta" id="create" style="font-size:22px">建立場次</button>
      <p class="muted">不會儲存電話號碼。顧客寫給櫃台的話會先在手機上加密，只有櫃台裝置看得到。</p>
    </div>
    <div class="box"><h2>還沒有 Firebase 資料庫？</h2>
      <ol class="steps"><li>到 console.firebase.google.com 建立專案。</li><li>左邊選單「建構 → Realtime Database」→ 建立資料庫（位置選新加坡，鎖定模式）。</li><li>到「規則」分頁貼上安全規則，按「發布」。</li><li>回「資料」分頁，複製上方的資料庫網址，貼到上面。</li></ol>
      <a class="btn sm" href="./" style="justify-self:start">先用模擬版（不需要網路同步）</a>
    </div></div>`;
  $("#create").onclick=async()=>{
    const host=Q.cleanHost($("#host").value),store=($("#store").value.trim()||"台北文創門市").slice(0,12),err=$("#err"),btn=$("#create");
    if(!host){err.textContent="這不像是 Firebase 資料庫網址。\n格式像：https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app";return}
    if(!Q.crypto.ok){err.textContent="這個瀏覽器不支援加密功能，請改用 Chrome、Edge 或 Safari，並用 https 網址開啟。";return}
    btn.disabled=true;btn.textContent="建立中…";err.textContent="";
    const room=Q.rand(22);let c=null;
    try{const key=await Q.crypto.genStaffKey();
      c=Q.connect(host,room,()=>{},()=>{});
      await c.put("/meta",{pub:key.pub,store:store,desks:3,t:Q.TS});c.close();
      ls.set("qt-live-host",host);ls.set("qt-live-store",store);
      sess={host,room,d:key.d,pub:key.pub,store};Q.sess.save(sess);start();
    }catch(e){if(c)c.close();btn.disabled=false;btn.textContent="建立場次";err.textContent=errText(e)}
  };
}

/* ================= 櫃台主畫面 ================= */
function start(){
  try{history.replaceState(null,"","#"+Q.linkOf(sess,false))}catch(e){}
  plain.clear();$("#sessBtn").hidden=false;
  if(conn)conn.close();
  conn=Q.connect(sess.host,sess.room,room=>{V=Q.view(room);

  const o=JSON.parse(txt.replace(/^```(json)?|```$/g,"").trim());
  return {cat:CAT_LIST.includes(o.cat)?o.cat:chosen,sum:String(o.summary||"").slice(0,30),prep:(Array.isArray(o.prep)?o.prep:[]).slice(0,3).map(x=>String(x).slice(0,20)),mins:Math.max(1,Math.min(60,parseInt(o.mins)||CATS_T[chosen]||10)),by:"ai"};

const CATS_T={"繳費/儲值":4,"續約/換約/新申辦":18,"異動/諮詢/維修":10,"網路取貨/預約取件":5};

const plainR=new Map();

      try{const r=await geminiClassify("合約下個月到期，想看看有沒有比較便宜的 5G 方案","異動/諮詢/維修");msg.textContent=`✓ 可以用！測試結果：${r.cat}・${r.sum}`;decryptNew()}
      catch(err){msg.textContent="✗ 連不上 AI："+String(err.message||err).slice(0,90)}}
    if(k==="cscr")copy(scr,"大螢幕連結");if(k==="cline")copy(line,"LINE 版取號連結");if(k==="ccust")copy(cust,"顧客取號連結");if(k==="cstaff")copy(staff,"櫃台加入連結");
    try{
      if(k==="fake"){const s=SAMPLE[Math.floor(Math.random()*SAMPLE.length)];const sealed=s[1]?await Q.crypto.seal(sess.pub,s[1]):null;
        const t={cat:s[0],st:"w",t:Q.TS,lang:"zh"};if(sealed)t.say=sealed;await conn.post("/tickets",t);flash("已加入一位測試顧客")}
      if(k==="wipe"&&confirm("確定清空所有號碼嗎？顧客手機上的號碼也會一起失效。")){await conn.del("/tickets");plain.clear();flash("已清空，下一位會是 A101")}
    }catch(err){flash("沒有送出，請檢查網路後再試一次",4200)}
    if(k==="new"&&confirm("確定結束這個場次嗎？目前的 QR Code 會全部失效。")){if(conn)conn.close();conn=null;sess=null;Q.sess.clear();try{history.replaceState(null,"",location.pathname)}catch(e2){}sh.hidden=true;renderSetup()}
  };
}
$("#sessBtn").onclick=openSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden){$("#sheet").hidden=true;render()}});

/* ================= 啟動 ================= */
(function boot(){
  const fromLink=Q.parseLink(),saved=Q.sess.load();
  if(fromLink){sess=saved&&saved.room===fromLink.room?Object.assign({},saved,{d:fromLink.d||saved.d}):fromLink;Q.sess.save(sess)}
  else sess=saved;
  if(sess)start();else renderSetup();
})();
</script>
