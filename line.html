<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f1e4d2">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Archivo+Black&display=swap">
<title>叫號說・LINE 官方帳號（概念示意）</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--chat:#efe6da;--me:#9ee26b;--hdr:#f1e4d2;--teal:#E8893A;--ink:#2D2E67;--muted:#6b7086;--orange:#E8893A;--yellow:#F5C543;--sky:#5B5BA5;--green:#06b04f;--red:#DD4F3C;
  --f:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1f2a44;font-family:var(--f);color:var(--ink);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{height:100%;display:grid;place-items:center}
.phone{position:relative;width:min(100%,420px);height:min(100%,880px);background:var(--chat);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){.phone{border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.45);height:min(calc(100% - 32px),880px)}}
html.is-phone .wrap{display:block}html.is-phone .phone{width:100%;height:100%;border-radius:0}
.top{background:var(--hdr);color:var(--ink);display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;flex:none}
.top .back small{font-size:20px;font-weight:700;margin-left:4px;vertical-align:4px}
.top .back{border:0;background:none;color:var(--ink);font-size:30px;line-height:1;padding:0 6px 2px 2px}
.top .nm{flex:1;min-width:0}
.top .nm b{display:flex;align-items:center;gap:5px;font-size:17px;white-space:nowrap;overflow:hidden}
.top .nm b span{overflow:hidden;text-overflow:ellipsis}
.top .nm b svg{width:18px;height:18px;flex:none}
.top .nm small{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#5a5446}
.top .nm small i{width:7px;height:7px;border-radius:50%;background:#aaa;display:inline-block}
.top .nm small.ok i{background:#06b04f}.top .nm small.bad i{background:var(--red)}
.top .icb{border:0;background:none;padding:0;color:var(--ink);display:grid}
.top .ic{width:24px;height:24px;flex:none;color:var(--ink)}
.mock{background:#fff7d6;color:#6b5300;font-size:11.5px;font-weight:700;text-align:center;padding:4px 8px;flex:none}
.chat{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 10px 16px;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;background:rgba(0,0,0,.12);color:#fff;font-size:11px;border-radius:999px;padding:2px 10px}
.m{display:flex;gap:6px;align-items:flex-end;max-width:100%}
.m .av{width:34px;height:34px;border-radius:50%;background:#fff url(line-assets/oa-avatar.png) center/cover;box-shadow:0 0 0 1px #e2d6c4;flex:none;align-self:flex-start}
.m .col{display:grid;gap:3px;min-width:0;max-width:78%}
.m .who{font-size:11px;color:#5a5446}
.m:not(.me) .b{background:#ead9cb;border:1.5px solid #c9b29e}
.b{background:#fff;border-radius:18px;padding:9px 12px;font-size:15px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-line}
.m.me{flex-direction:row-reverse}
.m.me .b{background:var(--me)}
.tm{font-size:10px;color:#6f6656;white-space:nowrap;text-align:right;line-height:1.3}
.card{background:#fff;border-radius:16px;overflow:hidden;width:min(275px,74vw);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .hd{padding:10px 14px;color:#fff;font-weight:900;font-size:13px;background:var(--sky)}
.card.or .hd{background:var(--orange)}.card.gr .hd{background:var(--green)}.card.gy .hd{background:#7a7f95}
.card .bd{padding:10px 14px;display:grid;gap:6px}
.card .no{font-size:46px;font-weight:900;line-height:1;letter-spacing:.02em}
.card .desk{font-size:20px;font-weight:900}
.card .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card .row2 div{background:#f2f4fa;border-radius:10px;padding:5px 8px;font-size:11px;color:var(--muted)}
.card .row2 b{display:block;font-size:20px;color:var(--ink)}
.card p{margin:0;font-size:13px;color:#3d4256}
.card .ft{display:grid;border-top:1px solid #e4e6ee}
.card .ft button{border:0;background:none;color:#2a6fd6;font-weight:700;font-size:14px;padding:10px;border-bottom:1px solid #e4e6ee}
.card .ft button:last-child{border-bottom:0}
.card .ft button:disabled{color:#aaa}
.qr{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;flex:none;background:var(--chat);scrollbar-width:none}
.qr button{flex:none;border:1px solid #d9cdb9;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:#21325a}
.qr:empty{display:none}
.menu{background:#eceef1;flex:none;border-top:1px solid #ddd2c2}
.menu[hidden]{display:none}
.rmtabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px 4px}
.rmtabs button{position:relative;border:0;border-radius:999px;font-weight:900;font-size:17px;letter-spacing:.04em;padding:9px 8px 9px 46px;color:var(--ink);background:linear-gradient(#fbfbfc,#d9dadf);box-shadow:0 2px 3px rgba(0,0,0,.18),inset 0 1px 0 #fff}
.rmtabs button i{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:17px;background:linear-gradient(#ff9a3d,#f05a00);color:#fff;box-shadow:0 0 0 2px #fff}
.rmtabs button[aria-selected="true"]{background:linear-gradient(#ff8a1e,#f15a00);color:#fff;box-shadow:0 2px 4px rgba(200,70,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.rmtabs button[aria-selected="true"] i{background:#fff;color:#f15a00}
.rmgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:10px 10px 14px}
.rmgrid button{position:relative;border:0;border-radius:12px;background:linear-gradient(#f4f4f6,#e7e7ea);min-height:74px;padding:0 10px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:4px;text-align:left;font-weight:900;font-size:19px;color:var(--ink);box-shadow:2px 3px 4px rgba(0,0,0,.16);overflow:hidden}
.rmgrid button span{border-left:4px solid #f15a00;padding-left:7px;line-height:1.15;white-space:nowrap}
.rmgrid button em{font-style:normal;font-size:40px;line-height:1;flex:none;filter:drop-shadow(1px 2px 1px rgba(0,0,0,.15))}
.rmgrid button b.new{position:absolute;top:0;left:0;background:#DD4F3C;color:#fff;font-size:10.5px;font-weight:900;padding:1px 7px;border-radius:12px 0 10px 0;letter-spacing:.05em}
.rmgrid button.hot{background:linear-gradient(#fff6ec,#ffe2c6);box-shadow:2px 3px 4px rgba(0,0,0,.16),0 0 0 2px #f15a00 inset}
.rmgrid button:active{filter:brightness(.95)}
.rmgrid.ban{grid-template-columns:1fr 1fr;gap:8px}
.rmgrid.ban .bn{display:grid;justify-content:stretch;align-items:center;color:#fff;font-size:inherit;padding:10px 12px;min-height:0}
.rmgrid.ban .bn.big{min-height:118px;padding-left:42%}.rmgrid.ban .bn.g5,.rmgrid.ban .bn.qt{min-height:68px}
.bn{position:relative;border:0;border-radius:6px;color:#fff;text-align:left;overflow:hidden;padding:10px 12px;display:grid;align-content:center;gap:2px;box-shadow:1px 2px 4px rgba(0,0,0,.25)}
.bn strong{font-size:18px;font-weight:900;font-style:italic;line-height:1.15;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.bn small{font-size:11.5px;font-weight:700;opacity:.92}
.bn.big{grid-column:1/-1;min-height:118px;padding-left:44%;background:radial-gradient(circle at 92% 30%,#9fc3ff 0,#3a63c9 18%,transparent 42%),linear-gradient(120deg,#05070f 0,#0d1838 55%,#1c2f6b)}
.bn.big strong{font-size:25px}
.bn.big small{justify-self:start;background:#f15a00;border-radius:4px;padding:1px 6px}
.bn.big em{position:absolute;left:8%;top:50%;transform:translateY(-50%) rotate(-8deg);font-style:normal;font-size:70px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.bn.g5{min-height:66px;background:radial-gradient(ellipse at 50% 120%,#ffd66b 0,#3e7bff 30%,transparent 60%),linear-gradient(#0a2a7a,#123a9e)}
.bn.qt{min-height:66px;background:linear-gradient(135deg,#ff9a3d,#f15a00 60%,#d84800)}
.bn.qt b.new{position:absolute;top:0;right:0;left:auto;background:#DD4F3C;color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:0 6px 0 8px}
.rmimg{position:relative;display:block;padding:0;line-height:0}
.rmimg img{width:100%;height:auto;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.rmimg .hs{position:absolute;border:0;background:transparent;padding:0;border-radius:14px;cursor:pointer}
.rmimg .hs:active{background:rgba(0,0,0,.08)}
.rmimg .hs:focus-visible{outline:3px solid var(--sky);outline-offset:-3px}
/* 仿銀行「個人化服務」的回覆卡片 */
.hub{background:#fff;border-radius:16px;width:min(292px,78vw);padding:16px 12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.hub h3{margin:0 0 4px;text-align:center;font-size:22px;font-weight:900}
.hub p{margin:0 0 12px;text-align:center;font-size:12px;color:var(--muted)}
/* 叫號說 App 的風格：粗黑框、純色塊、硬陰影 */
.hub .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 9px}
.hub .g button{border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:2px 2px 0 var(--ink);padding:10px 2px 8px;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:900;color:var(--ink);transition:transform .08s,box-shadow .08s}
.hub .g button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.hub .chip{width:48px;height:48px;border:2px solid var(--ink);border-radius:13px;display:grid;place-items:center;overflow:hidden}
.hub .chip svg{width:38px;height:38px}
.hub .chip.mai{background:#F6F6F9 url(line-assets/mai.png) 72% 4%/170% auto no-repeat}
.bar{background:#e4ddd2;display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));flex:none}
.bar .kb{border:0;background:none;padding:0;width:32px;height:32px;color:var(--ink);flex:none}
.bar .kb svg{width:30px;height:30px}
.bar .tog{flex:1;border:0;background:none;font-weight:500;font-size:16px;color:var(--ink);white-space:nowrap}
.bar .tog span{display:inline-block;font-size:11px;transition:transform .2s}
.bar .tog.closed span{transform:rotate(180deg)}
.typing{flex:1;display:flex;gap:6px}.typing[hidden]{display:none}
.typing input{flex:1;min-width:0;border:0;border-radius:999px;padding:8px 13px;font-size:16px;background:#fff}
.typing button{border:0;background:var(--teal);color:#fff;border-radius:999px;font-weight:900;padding:0 14px}
.card .sname{font-size:19px;font-weight:900;line-height:1.3}
.card .no.sm{font-size:30px}
.card p.demo,.note.demo{font-size:11.5px;color:#7a5a00;background:#fff7d6;border-radius:8px;padding:4px 7px}
.card .grid3{grid-template-columns:repeat(3,1fr);text-align:center;font-size:12.5px;font-weight:700}
.card .grid3 span{display:grid;justify-items:center;gap:4px;background:#f3f4f6;border-radius:10px;padding:8px 2px}
.card .grid3 svg{width:28px;height:28px;color:var(--teal)}
.slist .w em{font-style:normal;font-size:15px;font-weight:900;color:var(--ink)}
.rq em.opt{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
#liff .rq textarea{min-height:76px}
.yn.f3 button{font-size:13px;padding:7px 2px}
.muted{color:var(--muted);font-size:12px}
#liff .sh small a{color:#2a6fd6;font-weight:700}
/* LIFF 取號畫面 */
#liff{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
#liff[hidden]{display:none}
#liff .sheet{width:100%;height:92%;background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(100%)}}
#liff .sheet.noanim{animation:none}
#liff .sh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #e6e8ef;flex:none}
#liff .sh b{flex:1;font-size:16px}
#liff .sh small{font-size:11px;color:var(--muted);display:block;font-weight:500}
#liff .sh button{border:0;background:#f0f2f6;border-radius:50%;width:32px;height:32px;font-size:16px}
#liff .sb{flex:1;grid-auto-rows:max-content;overflow-y:auto;overscroll-behavior:contain;padding:14px;display:grid;gap:14px;align-content:start}
.lbl{font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px}
.lbl i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center;font-size:12px}
.lbl em{font-style:normal;font-weight:500;font-size:12px;color:var(--muted)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats button{border:2px solid #d5d9e6;border-radius:12px;background:#fff;padding:10px 8px;text-align:left;font-weight:900;font-size:14px;line-height:1.3}
.cats button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:2px}
.cats button[aria-pressed="true"]{border-color:var(--green);background:#e9f9ef}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px dashed #9aa0b2;border-radius:999px;background:#fff;font-size:13px;padding:3px 10px}
textarea{width:100%;min-height:76px;border:2px solid #d5d9e6;border-radius:12px;padding:9px 11px;font-size:16px;resize:none}
.cnt{text-align:right;font-size:12px;color:var(--muted);margin-top:-8px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-weight:700;font-size:14px;background:#fff4e8;border:2px solid #f6c08f;border-radius:12px;padding:9px 11px}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--green)}
.chk small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.note{background:#eef6ff;border-radius:12px;padding:9px 11px;font-size:13px;color:#2b3f66}
.go{border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:900;font-size:18px;padding:14px;width:100%}
.go:disabled{opacity:.45}
.err{color:var(--red);font-size:13px;font-weight:700;min-height:1em}
.cities{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cities button{flex:none;border:1.5px solid #c9cedd;border-radius:999px;background:#fff;font-size:13px;font-weight:700;padding:3px 11px}
.cities button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;border:2px solid #d5d9e6;border-radius:12px;padding:8px 11px;font-size:16px}
.slist{display:grid;gap:8px}
.slist button{border:1.5px solid #d5d9e6;border-radius:12px;background:#fff;text-align:left;padding:9px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.slist button[aria-pressed="true"]{border-color:var(--green);background:#e9f9ef}
.slist b{font-size:15px}.slist small{grid-column:1;font-size:12px;color:var(--muted)}
.slist .w{grid-row:1/3;grid-column:2;font-size:12px;font-weight:700;color:#21325a;text-align:right;white-space:nowrap}
.slist .live{display:inline-block;font-size:10.5px;font-weight:900;color:#fff;background:var(--green);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:2px}
.card .ft a{display:block;text-align:center;color:#2a6fd6;font-weight:700;font-size:14px;padding:10px;border-bottom:1px solid #e4e6ee;text-decoration:none}
.card .ft a:last-child{border-bottom:0}
.faces{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #e4e6ee}
.faces button{border:0;border-right:1px solid #e4e6ee;background:none;font-size:13px;font-weight:700;padding:10px 4px;display:grid;justify-items:center;gap:2px;color:#21325a}
.faces button:last-child{border-right:0}.faces button i{font-style:normal;font-size:26px}
.faces button:disabled{opacity:.4}
.rq{display:grid;gap:6px}
.rq b{font-size:15px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:2px solid #d5d9e6;border-radius:10px;background:#fff;font-weight:900;font-size:18px;padding:6px 0}
.scale button[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}
.scale-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.yn{display:flex;gap:8px}.yn button{flex:1;border:2px solid #d5d9e6;border-radius:10px;background:#fff;font-weight:700;padding:7px}
.yn button[aria-pressed="true"]{border-color:var(--orange);background:#fff1e6}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== 叫號說 App 的設計語言：取號／選門市／滿意度畫面、官方帳號傳來的號碼卡片，跟 App 同一套 ===== */
:root{--paper:#FFFFFF;--cream:#F6F6F9;--lilac:#D9D9EE;--qg:#4BA882;--line:2px solid var(--ink);--shadow:2px 2px 0 var(--ink);--f-num:"Archivo Black","Noto Sans TC",Impact,sans-serif}
#liff .sheet{background:var(--paper);border:var(--line);border-bottom:0;border-radius:20px 20px 0 0}
#liff .sh{background:var(--sky);color:#fff;border-bottom:var(--line)}
#liff .sh small{color:#dfe2ff}#liff .sh small a{color:var(--yellow)}
#liff .sh button{background:var(--yellow);color:var(--ink);border:var(--line);font-weight:900;box-shadow:2px 2px 0 var(--ink)}
.lbl i{background:var(--yellow);color:var(--ink);border:2px solid var(--ink)}
.cats button,.slist button,.yn button,.scale button,.cities button,.chips button{border:var(--line);background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.cats button[aria-pressed="true"],.slist button[aria-pressed="true"]{background:var(--sky);color:#fff;border-color:var(--ink)}
.cats button[aria-pressed="true"] small,.slist button[aria-pressed="true"] small,.slist button[aria-pressed="true"] .w,.slist button[aria-pressed="true"] .w em{color:#dfe2ff}
.cats button:active,.slist button:active,.yn button:active,.scale button:active,.chips button:active,.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.chips button{border-style:dashed;border-width:2px;box-shadow:none;font-weight:700}
.cities button{box-shadow:2px 2px 0 var(--ink);border-width:2px}
.cities button[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--ink)}
.slist .w em{font-family:var(--f-num);font-weight:400}
.mapsb{gap:12px}
.mapbox{border:var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);height:min(46vh,340px);background:#e8eef5}
.mapbox iframe{width:100%;height:100%;border:0;display:block}
.row2m{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2m div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.row2m b{display:block;font-family:var(--f-num);font-weight:400;font-size:20px;color:var(--ink)}
a.go{display:block;text-align:center;text-decoration:none}
.go.alt{background:#fff}
.slist .live.cur{background:var(--yellow)}
.slist .live{background:var(--qg);color:var(--ink);border:1.5px solid var(--ink)}
.scale button{font-family:var(--f-num);font-weight:400;font-size:20px;padding:4px 0}
.scale button[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.yn button[aria-pressed="true"]{background:var(--yellow);border-color:var(--ink)}
textarea,.search,#liff .rq textarea{border:var(--line);background:#fff}
textarea:focus,.search:focus{outline:3px solid var(--yellow);outline-offset:1px}
.chk{background:var(--cream);border:var(--line)}
.note{background:#e3f7ea;border:2px solid var(--ink);color:var(--ink);font-weight:700}
.note.demo,.card p.demo{background:var(--cream);border:1.5px dashed var(--ink);color:var(--ink)}
.go{background:var(--yellow);color:var(--ink);border:var(--line);box-shadow:3px 3px 0 var(--ink);font-size:20px;letter-spacing:.04em}
.go:disabled{opacity:.5;box-shadow:2px 2px 0 var(--ink)}
/* 號碼卡片 */
.card{border:var(--line);box-shadow:var(--shadow);border-radius:18px;background:var(--paper)}
.card .hd{background:var(--sky);border-bottom:var(--line)}
.card.or .hd{background:var(--orange)}.card.gr .hd{background:var(--qg);color:var(--ink)}
.card .no{font-family:var(--f-num);font-weight:400;font-size:52px}
.card .no.sm{font-size:32px}
.card .bd{background:linear-gradient(135deg,#d8dcf7,#D9D9EE 40%,#e9ebfb 60%,#a9afe8)}
.card.or .bd,.card.gr .bd{background:var(--paper)}
.card .row2 div{background:#fff;border:2px solid var(--ink);color:var(--ink)}
.card .row2 b{font-family:var(--f-num);font-weight:400}
.card p{color:var(--ink)}
.card .ft{border-top:var(--line);gap:8px;padding:10px;background:var(--paper)}
.card .ft button,.card .ft a{border:var(--line)!important;border-radius:11px;background:#fff;color:var(--ink);font-weight:900;box-shadow:var(--shadow);padding:8px}
.card .ft button:first-child{background:var(--yellow)}
.card .ft button:disabled{background:#eee;color:#888;box-shadow:none}
.faces{border-top:var(--line);gap:8px;padding:10px 10px 0;background:var(--paper)}
.faces button{border:var(--line)!important;border-radius:12px;background:#fff;box-shadow:var(--shadow);color:var(--ink)}
.card .grid3 span{background:#fff;border:2px solid var(--ink)}

/* ===== 叫號說新配色：取自台灣大哥大 logo（深藏青 #2D2E67、紫藍 #5B5BA5、暖橘 #E8893A、金黃 #F5C543、紅橘 #DD4F3C、綠 #4BA882）。舊版：git tag pre-palette-v3 ===== */
/* ===== 新配色（logo 色） ===== */
:root{--paper:#ffffff;--cream:#FFF3E6}
.card .bd{background:#fff}
.card{border-top-width:2px}
.card .hd{background:#5B5BA5}
.card .ft button:first-child,.go{background:#E8893A;color:#fff}
.card .no{color:#2D2E67}

/* v3 */
.card{border:1.5px solid #DEDEEA!important;box-shadow:0 6px 18px rgba(45,46,103,.10)!important}
.card .hd{background:#2D2E67!important;border-bottom:0!important;background-image:linear-gradient(90deg,#F5C543 0 25%,#E8893A 25% 50%,#DD4F3C 50% 62%,#5B5BA5 62% 82%,#4BA882 82% 100%)!important;background-size:100% 4px!important;background-repeat:no-repeat!important;background-position:bottom!important}
.card .row2 div{border:0!important;background:#F2F2F7!important}
.card .ft{border-top:1px solid #E4E4EE!important}
.card .ft button:not(:first-child),.card .ft a{border:1.5px solid #DEDEEA!important;box-shadow:none!important}
.card .ft button:first-child{border:2.5px solid #2D2E67!important;box-shadow:3px 3px 0 #2D2E67!important}

/* 線稿圖示預覽 */
.li{width:1.15em;height:1.15em;vertical-align:-.2em;color:#2D2E67;flex:none}
.li .ac{stroke:#E8893A}
.li.inl{margin-right:.15em}
.cat .cat-i,.cats .cat-i{width:26px;height:26px;display:block;margin-bottom:4px}
.cat[aria-pressed="true"] .li,.cats button[aria-pressed="true"] .li{color:currentColor}
.cat[aria-pressed="true"] .li .ac,.cats button[aria-pressed="true"] .li .ac{stroke:currentColor}

/* LINE 功能卡改線稿 */
.hub .chip:not(.mai){background:#fff!important;}
.hub .chip{border:1.5px solid #DEDEEA!important;border-radius:14px}
.hub .chip svg.li{width:30px;height:30px}
.hub .g button{border:1.5px solid #DEDEEA!important;box-shadow:0 3px 10px rgba(45,46,103,.07)!important;font-weight:700!important}
.hub .chip.mai{border:1.5px solid #DEDEEA!important}

/* LINE 裡的叫號說畫面（取號、選門市、滿意度、地圖）：第三版乾淨風格 */
#liff .sheet{border:0!important;box-shadow:0 -10px 30px rgba(45,46,103,.18);background:#F6F6F9!important}
#liff .sh{background:#2D2E67!important;border-bottom:4px solid transparent!important;border-image:linear-gradient(90deg,#F5C543 0 25%,#E8893A 25% 50%,#DD4F3C 50% 62%,#5B5BA5 62% 82%,#4BA882 82% 100%) 1!important}
#liff .sh button{background:#fff!important;color:#2D2E67!important;border:0!important;box-shadow:none!important}
.lbl i{background:#2D2E67!important;color:#fff!important;border:0!important}
.cats button,.slist button,.yn button,.scale button,.cities button{border:1.5px solid #DEDEEA!important;box-shadow:0 3px 10px rgba(45,46,103,.06)!important;background:#fff}
.cats button{border-left-width:6px!important}
.cats button:nth-child(1){border-left-color:#F5C543!important}.cats button:nth-child(2){border-left-color:#E8893A!important}
.cats button:nth-child(3){border-left-color:#5B5BA5!important}.cats button:nth-child(4){border-left-color:#4BA882!important}
.cats button:nth-child(1)[aria-pressed="true"]{background:#F5C543!important;color:#2D2E67!important}
.cats button:nth-child(2)[aria-pressed="true"]{background:#E8893A!important;color:#fff!important}
.cats button:nth-child(3)[aria-pressed="true"]{background:#5B5BA5!important;color:#fff!important}
.cats button:nth-child(4)[aria-pressed="true"]{background:#4BA882!important;color:#fff!important}
.cats button[aria-pressed="true"] small{color:inherit!important;opacity:.85}
.slist button[aria-pressed="true"]{background:#fff!important;color:#2D2E67!important;border-color:#E8893A!important;box-shadow:0 0 0 2px #E8893A inset!important}
.slist button[aria-pressed="true"] small,.slist button[aria-pressed="true"] .w,.slist button[aria-pressed="true"] .w em{color:inherit!important}
.chips button{border:1.5px solid #DEDEEA!important;background:#fff!important;border-style:solid!important}
.cities button[aria-pressed="true"]{background:#2D2E67!important;color:#fff!important;border-color:#2D2E67!important}
.scale button[aria-pressed="true"]{background:#E8893A!important;color:#fff!important;border-color:#E8893A!important}
.yn button[aria-pressed="true"]{background:#FFF3E6!important;border-color:#E8893A!important}
textarea,.search,#liff .rq textarea{border:1.5px solid #DEDEEA!important;border-radius:12px}
.chk{background:#fff!important;border:1.5px solid #DEDEEA!important}
.note{background:#fff!important;border:1.5px solid #DEDEEA!important;font-weight:500!important}
.go{background:#E8893A!important;color:#fff!important;border:2.5px solid #2D2E67!important;box-shadow:3px 3px 0 #2D2E67!important}
.go.alt{background:#fff!important;color:#2D2E67!important}
.mapbox{border:1.5px solid #DEDEEA!important;box-shadow:0 6px 18px rgba(45,46,103,.1)!important}
.row2m div{border:1.5px solid #DEDEEA!important}
.faces{border-top:1px solid #E4E4EE!important}
.faces button{border:1.5px solid #DEDEEA!important;box-shadow:none!important}

/* 分享給家人 */
.card .ft a.share{display:block;text-align:center;font-size:13px;font-weight:700;color:#5B5BA5!important;border:0!important;box-shadow:none!important;background:none!important;padding:6px 0 2px;text-decoration:none}
.card.fam .hd{background:#4BA882!important}
.flist{display:grid;gap:8px}
.flist button{display:flex;align-items:center;gap:10px;border:1.5px solid #DEDEEA;border-radius:14px;background:#fff;padding:8px 12px;text-align:left;font-size:15px;color:#2D2E67}
.flist button[aria-pressed="true"]{border-color:#06C755;box-shadow:0 0 0 2px #06C755 inset}
.flist .fav{width:34px;height:34px;border-radius:50%;background:#EDEDF6;display:grid;place-items:center;font-weight:900;font-size:15px;flex:none}
.flist b{flex:1}.flist i{font-style:normal;font-weight:900;color:#06C755;width:18px}
#sgo:disabled{opacity:.45}
.card .hd .li,#liff .sh .li{color:#fff}.card .hd .li .ac,#liff .sh .li .ac{stroke:#F5C543}

/* 等候推薦輪播 */
.card.reco{width:min(320px,84vw)}
.card.reco .hd{background:#5B5BA5!important}
.rcs{display:flex;gap:10px;overflow-x:auto;padding:12px;scroll-snap-type:x mandatory;scrollbar-width:none;background:#F6F6F9}
.rc{flex:none;width:170px;scroll-snap-align:start;background:#fff;border:1.5px solid #DEDEEA;border-radius:14px;overflow:hidden;display:grid;gap:4px;padding-bottom:8px}
.rc-img{position:relative;height:96px;background:#5B5BA5 center/cover no-repeat;display:grid;place-items:center}
.rc-img i{font-style:normal;font-size:40px}
.rc-img.game{background:linear-gradient(135deg,#F5C543,#E8893A)}.rc-img.learn{background:linear-gradient(135deg,#4BA882,#5B5BA5)}
.rc-img span{position:absolute;right:6px;bottom:6px;background:rgba(45,46,103,.85);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px}
.rc b{font-size:13px;line-height:1.35;padding:0 10px;color:#2D2E67}
.rc small{font-size:11.5px;color:#6b6b90;padding:0 10px}
.rc button{margin:4px 10px 0;border:0;border-radius:10px;background:#E8893A;color:#fff;font-weight:900;font-size:13px;padding:7px}
.card .ft button.watch{background:#F2FBF5!important;color:#06A045!important;border:1.5px solid #06C755!important;box-shadow:none!important}

/* 預約取機 */
.hub .pkline{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;text-align:left;width:100%;margin:0 0 12px;border:0;border-radius:14px;padding:10px 12px;background:linear-gradient(135deg,#2D2E67,#5B5BA5);color:#fff}
.hub .pkline span{grid-row:1/3;font-size:28px}.hub .pkline b{font-size:14.5px}.hub .pkline small{font-size:11.5px;color:#D9D9EE}
.card.pkc .hd{background:#5B5BA5!important}
.pkord{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid #DEDEEA;border-radius:12px;padding:10px}
.pkord>span{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#F5C543,#E8893A);display:grid;place-items:center;font-size:22px;flex:none}
.pkord small{display:block;font-size:12px;color:#6b6b90}.pkord em{font-style:normal;font-weight:900;font-size:12px;color:#3A8A69}
.lbl em{font-style:normal;font-weight:500;font-size:11.5px;color:#6b6b90}
.slist .stk{font-size:11.5px!important;font-weight:900!important;border-radius:999px;padding:2px 8px}
.slist .stk.g{background:#E5F6EE;color:#2f8a62!important}.slist .stk.y{background:#FFF4D6;color:#9a6b00!important}.slist .stk.x{background:#FBE4E1;color:#B5372A!important}
.slist button:disabled{opacity:.45}
.pkslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pkslots button{border:1.5px solid #DEDEEA;border-radius:10px;background:#fff;padding:6px 2px;font-weight:900;font-size:14px;color:#2D2E67}
.pkslots small{display:block;font-size:11px;color:#3A8A69}
.pkslots button[aria-pressed="true"]{background:#E8893A;color:#fff;border-color:#E8893A}.pkslots button[aria-pressed="true"] small{color:#fff}
.pkslots button:disabled{opacity:.45}.pkslots button:disabled small{color:#B5372A}
p.sys{margin:0;font-size:11px;color:#6f6656;text-align:center}

/* ===== 品牌識別：台灣大哥大（強背書的弱化寫法，仿「大哥付」）＋叫號說 ===== */

.qtb img{height:1.75em;width:auto;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.qtb>span{display:grid;line-height:1.02;min-width:0}
.qtb small{font-size:.5em;font-weight:700;letter-spacing:.14em;opacity:.82;white-space:nowrap}
.qtb b{font-weight:900;letter-spacing:.04em;white-space:nowrap}

.card.deal .hd{background:#E8893A!important}
.rc-img.dl{background:#FFF3E6}
.rc button.on{background:#4BA882}
.rc button:disabled{opacity:.5}
.dnote{margin:0;padding:0 12px 10px;font-size:11px;color:#6b6b90;background:#F6F6F9}
.card.cpc .bd{display:grid;gap:8px}
.cpn{display:flex;border:1.5px solid #DEDEEA;border-radius:12px;overflow:hidden;background:#fff}
.cpn-l{min-width:76px;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#F5C543,#E8893A);color:#fff;font-family:var(--f-num);font-size:20px;line-height:1.1;padding:8px 4px}
.cpn-l small{display:block;font-family:var(--f);font-size:10.5px;font-weight:700}
.cpn-r{display:grid;align-content:center;padding:6px 10px;border-left:2px dashed #DEDEEA}.cpn-r b{font-size:13.5px}.cpn-r small{font-size:11px;color:#DD4F3C;font-weight:700}
p.prep{margin:4px 0 0;font-size:12.5px;background:#F2FBF5;border-radius:8px;padding:6px 8px;color:#2D2E67}
.hub .g button{position:relative}
.hbadge{position:absolute;top:6px;right:14px;z-index:2;background:#DD4F3C;color:#fff;font-style:normal;font-size:11px;font-weight:900;border-radius:999px;min-width:18px;padding:0 5px;line-height:18px}
.lswrow{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid #e6e6ee;text-align:left}.lswrow span{flex:1;display:grid}.lswrow small{font-size:12px;color:#6b6b90}.lswrow input{width:22px;height:22px;accent-color:#E8893A}

.hdi{display:inline-grid;vertical-align:-5px;margin-right:6px}.hdi svg.qi{width:22px;height:22px}
.rc-img.dl{display:grid;place-items:center;background:#FFF3E6}
.rc-img .dchip{position:static;padding:0;color:inherit;width:64px;height:64px;border-radius:18px;background:#fff;border:1.5px solid #DEDEEA;box-shadow:0 3px 10px rgba(45,46,103,.08);display:grid;place-items:center}.rc-img .dchip svg.qi{width:40px;height:40px}
button.watch svg.qi,.pkd svg.qi{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.pkd{margin:4px 0 0}

/* ---------- 我的號碼狀態 ---------- */
function mine(){return state.myId?VT().all.find(t=>t.id===state.myId)||null:null}
const active=t=>t&&(t.st==="w"||t.st==="c");
function waitOf(t,v){v=v||VT();const i=v.waiting.findIndex(x=>x.id===t.id),a=i<0?[]:v.waiting.slice(0,i);return {ahead:a.length,mins:Math.max(1,Math.round(a.reduce((s,x)=>s+(CATS[x.cat]?CATS[x.cat].t:10),0)/3+2))}}
function qMins(v){return Math.max(2,Math.round(v.waiting.reduce((s,x)=>s+(CATS[x.cat]?CATS[x.cat].t:10),0)/3+2))}
function storeMins(n){if(isLive(n))return qMins(VL);return ST?Math.max(2,ST.storeWait(n)):8}
const demoTag=n=>isLive(n)||DEMO?"":`<p class="demo">示意：這間門市還沒接上叫號系統，用模擬的隊伍展示流程。</p>`;
function ticketCard(t,title){const w=waitOf(t),docs=(CATS[t.cat]||CATS["異動/諮詢/維修"]).docs;
  return `<div class="card"><div class="hd">${title||"取號成功"}・${esc(state.tkStore||myStore())}</div><div class="bd"><div class="no">${t.no}</div><p>${esc(t.cat)}</p>
    <div class="row2"><div>前面還有<b>${w.ahead} 組</b></div><div>預估等候<b>${w.mins} 分</b></div></div>
    <p>📋 請先準備：${docs.map(esc).join("、")}</p><p style="font-size:12px;color:#6b7086">輪到你時，會在這裡傳訊息通知你。不用一直盯著。</p>${state.tkLive||DEMO?"":demoTag(state.tkStore)}</div>
    <div class="ft"><button data-card="mine">查看最新進度</button><button class="watch" data-card="watch" data-open="" data-lbl="等候時看看">▶ 等候時看看（影片・小遊戲）</button><button data-card="hold" data-hold="${t.id}">我需要晚一點（往後延 2 組）</button><a class="share" href="#" data-card="share" data-tid="${t.id}">↗ 分享號碼給家人</a></div></div>`}
function liveButtons(){const t=mine();{const pk=tkPk(t);document.querySelectorAll("[data-card=pick]").forEach(b=>{const on=active(t)&&pk.includes(b.dataset.d);b.classList.toggle("on",on);b.textContent=on?"✓ 已選好":"先選好";b.disabled=!active(t)})}document.querySelectorAll("[data-hold]").forEach(b=>{b.disabled=!t||t.held||!active(t)||b.dataset.hold!==state.myId;if(t&&t.held&&b.dataset.hold===state.myId)b.textContent="已延後過（只能用一次）"});
  document.querySelectorAll("[data-face],[data-card=survey]").forEach(b=>{if(state.rated[b.dataset.tid])b.disabled=true})}
function storeCard(n,title){const live=isLive(n),v=live?VL:null;
  return `<div class="card"><div class="hd">${title||"🏪 已選擇門市"}</div><div class="bd"><div class="sname">${esc(n)}${live?'<span class="live">現場連線</span>':""}</div>
    <p>📍 ${esc(addrOf(n)||"（地址請洽門市）")}</p>
    <div class="row2"><div>現在等候<b>${live?v.waiting.length+" 組":"約 "+Math.max(1,Math.round(storeMins(n)/4))+" 組"}</b></div><div>預估等候<b>${storeMins(n)} 分</b></div></div>
    ${demoTag(n)}</div>
    <div class="ft"><button data-card="take">在這間線上取號</button><button data-card="map" data-store="${esc(n)}">📍 查看地圖・導航</button><button data-card="stores">換一間門市</button></div></div>`}
function menu(k,said){
  if(k==="hub"){me("【/門市取號/】");bot(hubCard());return}
  if(k.startsWith("ai:")){me(k.slice(3));bot(`您好，我是智能小麥 🙋‍♀️（概念示意）\n帳單、方案、漫遊的問題可以直接問我。\n需要到門市辦理的話，我可以幫你先線上取號，不用到現場抽號碼牌！`);setQuick([["幫我線上取號",()=>{state.msgs.pop();menu("take","幫我線上取號")}],["門市取號選單",()=>bot(hubCard())]]);return}
  if(k.startsWith("promo:")){me(k.slice(6));bot(`📣 ${esc(k.slice(6))}\n（概念示意：這裡是官方帳號原本的活動／服務連結）\n\n要到門市辦理的話，點「用戶服務 › 門市取號」先線上排隊，不用在現場抽號碼牌。`);return}
  if(k==="take"){me(said||"線上取號");const t=mine();if(active(t)){bot(`你已經有號碼 ${t.no}（${esc(state.tkStore)}）囉！辦完這次才能再取號。`);return}
    if(!state.store&&!liveStore){bot(`請先選一間要去的門市 👇`);openStores();return}
    openLiff();return}
  if(k==="mine"){me(said||"我的號碼");const t=mine();
    if(!active(t)){bot("你目前沒有號碼。點下方「用戶服務 › 門市取號」，先說說你要辦什麼，櫃台會先幫你準備。");return}
    if(t.st==="c"){bot(calledCard(t,"輪到你了"));return}
    bot(ticketCard(t,"目前進度"));return}
  if(k==="store"){me(said||"選擇門市");if(active(mine())){bot(`你正在 ${esc(state.tkStore)} 排隊（${mine().no}）。\n辦完或過號之後才能換門市喔。`);return}openStores();return}
  if(k==="pickup"){me("預約取機");if(state.pk){bot(pkCard());return}openPkSheet();return}
  if(k==="learn"){me("等候小教室");openWait("learn","等候小教室");return}
  if(k==="now"){me("門市現況");const n=myStore();
    if(isLive(n)){const d=[1,2,3].map(i=>VL.desks[i]?`${i} 號櫃台：${VL.desks[i].no}`:`${i} 號櫃台：—`).join("\n");bot(`🏪 ${esc(n)}（現場連線）\n現在等候：${VL.waiting.length} 組，約 ${qMins(VL)} 分\n${d}`)}
    else bot(storeCard(n,"🏪 門市現況"));return}
  if(k==="deals"){me("我的優惠");const t=mine();bot(active(t)?myDealsCard(t):storeDealsCard());return}
  if(k==="rate"){me("滿意度調查");const id=state.lastDone;if(id&&!state.rated[id]){openSurvey(null,id);return}
    bot(id?"這次的服務你已經評過分了，謝謝你 🙏":"辦完業務之後，這裡會請你幫櫃台的服務打個分數。");return}
  if(k==="more"){me("更多服務");bot(`<div class="card"><div class="hd">更多服務</div><div class="bd grid3">${[["mine","帳單查詢"],["point","會員點數"],["phone","維修進度"]].map(([i,l])=>`<span>${svg(i)}${l}</span>`).join("")}</div><div class="ft"><button data-card="take">要到門市辦？先線上取號</button></div></div>`);return}
}
function calledCard(t,title){return `<div class="card or"><div class="hd">🔔 ${title}・${esc(state.tkStore||myStore())}</div><div class="bd"><div class="no">${t.no}</div><div class="desk">請到 ${t.desk||1} 號櫃台</div><p>櫃台已經看過你寫的需求，正在等你。</p>${preparedHTML(t)}</div><div class="ft"><button data-card="here">我到了</button><button data-card="hold" data-hold="${t.id}">我還要 5 分鐘（往後延 2 組）</button><a class="share" href="#" data-card="share" data-tid="${t.id}">↗ 分享號碼給家人</a></div></div>`}

let city=null;
function openStores(){
  const cur=myStore();city=city||(ST&&ST.cityOf(cur))||"台北市";
  const L=$("#liff");L.hidden=false;
  L.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="選擇門市"><div class="sh"><div style="flex:1"><b>選擇門市</b><small>共 ${STORE_LIST.length} 間・等候時間跟叫號說 App 同步</small></div><button id="lx" aria-label="關閉">✕</button></div>
    <div class="sb">
      <input class="search" id="sq" type="search" placeholder="搜尋門市或地址，例如：西門町" autocomplete="off">
      <div class="cities" id="cities">${CITIES.map(c=>`<button data-city="${esc(c)}" aria-pressed="${c===city}">${esc(c)}</button>`).join("")}</div>
      <div class="slist" id="slist"></div>
    </div></div>`;
  $("#lx").onclick=closeLiff;
  const list=()=>{const q=$("#sq").value.trim();
    let a=q?STORE_LIST.filter(s=>(s.n+s.addr+s.c).includes(q)):STORE_LIST.filter(s=>s.c===city);
    a=a.slice().sort((x,y)=>((y.n===cur)-(x.n===cur))||(isLive(y.n)-isLive(x.n))||(storeMins(x.n)-storeMins(y.n))).slice(0,40);   // 目前的門市永遠排第一
    $("#slist").innerHTML=a.length?a.map(s=>`<button data-store="${esc(s.n)}" aria-pressed="${s.n===cur}"><b>${esc(s.n)}${s.n===cur?'<span class="live cur">目前門市</span>':""}${isLive(s.n)?'<span class="live">現場連線</span>':""}</b><small>${esc(s.addr||s.c)}</small><span class="w">現在約<br><em>${storeMins(s.n)} 分</em></span></button>`).join(""):`<p class="muted">找不到符合的門市</p>`;
    L.querySelectorAll("[data-store]").forEach(b=>b.onclick=()=>pickStore(b.dataset.store))};
  $("#sq").oninput=list;
  L.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{city=b.dataset.city;$("#sq").value="";L.querySelectorAll("[data-city]").forEach(x=>x.setAttribute("aria-pressed",x===b));list()});
  const sel=L.querySelector("[data-city][aria-pressed=true]");if(sel)sel.scrollIntoView({inline:"center",block:"nearest"});
  list();
}

    bot(rate.c?"謝謝你的回饋 🙇\n很抱歉這次沒讓你滿意，門市主管會在 3 天內透過這個官方帳號跟你聯絡。":R.f==="good"?"謝謝你的評分 🙏\n很高興幫上忙，下次需要也可以直接在這裡線上取號！":"謝謝你的評分 🙏\n我們會把你的意見交給門市，持續改進。")}
  catch(e){$("#err").textContent="網路不太穩，評分沒有送出，請再按一次。";g.disabled=false;g.textContent="送出評分"}}
function doneCard(t){return `<div class="card gr"><div class="hd">✅ 已辦理完成・${esc(state.tkStore||myStore())}</div><div class="bd"><div class="no sm">${t.no}</div><p>謝謝光臨！今天的問題解決了嗎？點表情告訴我們，接著 3 題快速評分。</p></div>
  <div class="faces">${Object.entries(FACE).map(([k,l])=>`<button data-face="${k}" data-tid="${t.id}"><i>${l.split(" ")[0]}</i>${l.split(" ")[1]}</button>`).join("")}</div>
  <div class="ft"><button data-card="survey" data-tid="${t.id}">填寫服務滿意度調查</button></div></div>`}

/* ---------- 聲音：取號那一下先把聲音打開，叫號時才能自動出聲 ---------- */
let actx=null;const clipIdx={},clipBuf={};
function ctx(){if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}return actx}
function prime(){try{const c=ctx();if(c){if(c.state!=="running")c.resume().catch(()=>{});const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}}catch(e){}
  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;u.lang="zh-TW";speechSynthesis.speak(u)}catch(e){}
  clipIndex("zh").then(()=>clipChunk("zh","x")).catch(()=>{})}
document.addEventListener("pointerdown",()=>{const c=actx;if(c&&c.state!=="running")c.resume().catch(()=>{})},true);
function chime(){const c=ctx();if(!c||c.state!=="running")return;const t0=c.currentTime+.02;
  [[1046.5,0],[1318.5,.16],[1568,.32]].forEach(([f,dt])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t0+dt);g.gain.linearRampToValueAtTime(.4,t0+dt+.015);g.gain.exponentialRampToValueAtTime(.001,t0+dt+.5);o.connect(g);g.connect(c.destination);o.start(t0+dt);o.stop(t0+dt+.6)})}
async function clipIndex(l){if(!clipIdx[l]){const r=await fetch("audio/"+l+"/index.json");if(!r.ok)throw 0;clipIdx[l]=await r.json()}return clipIdx[l]}
function clipChunk(l,ch){const k=l+"/"+ch;if(!clipBuf[k])clipBuf[k]=(async()=>{const r=await fetch("audio/"+k+".mp3");if(!r.ok)throw 0;const ab=await r.arrayBuffer();return await new Promise((res,rej)=>{const p=ctx().decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej)})})().catch(e=>{delete clipBuf[k];throw e});return clipBuf[k]}
async function playClips(keys){const c=ctx(),idx=await clipIndex("zh");if(!keys.every(k=>idx[k]))return;const bufs=await Promise.all(keys.map(k=>clipChunk("zh",idx[k][0])));let t=c.currentTime+.05;
  keys.forEach((k,i)=>{const s=c.createBufferSource();s.buffer=bufs[i];s.connect(c.destination);s.start(t,Math.max(0,idx[k][1]-.04),idx[k][2]+.12);t+=idx[k][2]+.17})}
const ZH_FEMALE=/Hanhan|Yating|HsiaoChen|HsiaoYu|Mei-?Jia|Meijia|美佳|Tingting|Ting-Ting|Sinji|Google\s*國語|Google\s*普通|Xiaoxiao|Xiaoyi|Huihui|Female|女/i,ZH_MALE=/Zhiwei|YunJhe|Yunxi|Yunyang|Kangkang|Li-?mu|Liang|Male|男/i;
try{speechSynthesis.getVoices();speechSynthesis.addEventListener("voiceschanged",()=>speechSynthesis.getVoices())}catch(e){}   // 先把語音清單載入，叫號時才挑得到女聲
function zhFemale(){try{const vs=speechSynthesis.getVoices(),n=v=>v.lang.toLowerCase().replace("_","-");const tw=vs.filter(v=>n(v)==="zh-tw"),zh=vs.filter(v=>n(v).startsWith("zh")&&!/hk|yue/.test(n(v)));
  for(const L of [tw,zh]){const f=L.filter(v=>ZH_FEMALE.test(v.name));const p=f.find(v=>v.localService!==false)||f[0]||L.find(v=>!ZH_MALE.test(v.name));if(p)return p}}catch(e){}return null}
function announce(no,desk){chime();try{navigator.vibrate&&navigator.vibrate([250,100,250,100,250])}catch(e){}
  setTimeout(()=>{let started=false;try{const line=`${no.replace(/^([A-Z])/,"$1 ")} 號，請到 ${desk} 號櫃台。`;const u=new SpeechSynthesisUtterance(line+" "+line);u.lang="zh-TW";const fv=zhFemale();if(fv)u.voice=fv;u.rate=.95;u.onstart=()=>started=true;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
    setTimeout(()=>{if(!started){try{speechSynthesis.cancel()}catch(e){}playClips([no,"q"+desk,no,"q"+desk]).catch(()=>{})}},1500)},600)}

/* ---------- 取號、延後 ---------- */
async function take(){
  const go=$("#go");go.disabled=true;go.textContent="取號中…";prime();
  const text=F.text.trim().slice(0,50),n=myStore(),live=isLive(n);
  try{
    state.tkStore=n;state.tkLive=live;state.notified={};state.calledSig=null;state.doneShown=false;
    if(!live){demoTake(text,n);}
    else{
      const t={cat:F.cat,st:"w",t:Q.TS,lang:"zh",src:"line"};if(F.p)t.p=true;
      if(text){const pub=VL.meta&&VL.meta.pub;let sealed=null;try{sealed=await Q.crypto.seal(pub,text)}catch(e){}if(sealed)t.say=sealed}
      const id=await conn.post("/tickets",t);state.myId=id;save();
      VL=Q.view(conn.data);
    }
    closeLiff();if(text)me(`我要辦：${F.cat}\n「${text}」`);else me(`我要辦：${F.cat}`);
    const t=mine();if(t){bot(pick(["收到！幫你排好了 👍 不用在門市乾等，先去附近逛逛也沒關係。","好的，號碼幫你拿好了！輪到你之前我會先提醒你 🙂"]));bot(ticketCard(t));setTimeout(()=>{const m=mine();if(m&&active(m)&&m.cat!=="繳費/儲值"){bot(`在家先看看今天${esc(state.tkStore||myStore())}最划算的 3 件事 👇 選好了，櫃台會先幫你備好。`);bot(homeCard(m))}},500);setTimeout(()=>{const m=mine();if(m&&active(m)){bot(`排隊時間不浪費 👇 幫你挑了${m.cat==="繳費/儲值"?"幾個":"跟「"+esc(m.cat.split("/")[0])+"」有關的"}內容，點了就在 LINE 裡打開，叫號照樣會通知你。`);bot(recoCard(m))}},1300)}
  }catch(e){$("#err").textContent=e&&(e.status===401||e.status===403)?"門市的叫號系統拒絕了這次取號，請洽現場人員。":"網路不太穩，請再按一次「取號」。";go.disabled=false;go.textContent="取號"}
}
async function doHold(){const t=mine();if(!t||t.held)return;me("我需要晚一點");
  if(t.st==="w"){const v=VT(),i=v.waiting.findIndex(x=>x.id===t.id);if(i>=v.waiting.length-1){bot("你後面目前沒有其他人，不用延後喔！輪到你時會在這裡通知你 🙂");return}}
  try{if(!state.tkLive)demoHold();else await conn.patch("/tickets/"+t.id,Q.holdPatch(VL,t.id,2));
    state.calledSig=null;state.notified={};save();bot("沒問題，已幫你往後延 2 組 👍\n快輪到你時會再通知你。（延後只能用一次）")}
  catch(e){bot("網路不太穩，沒有延後成功，請再按一次。")}}

/* ---------- 狀態變化 → 官方帳號主動傳訊息 ---------- */
function onData(){
  const t=mine();
  if(state.myId&&!t){if(!state.notified.gone){state.notified.gone=1;bot("門市的叫號已重新開始，之前的號碼失效了。需要的話請重新取號。");state.myId=null;save()}}
  else if(t){
    if(t.st==="w"){const w=waitOf(t);if(w.ahead<=2&&!state.notified.near){state.notified.near=1;save();bot(`還有 ${w.ahead} 組就到你囉，可以開始往門市走了 🚶 不用急，大約 ${w.mins} 分鐘。`);bot(ticketCard(t,"⏰ 快輪到你了"));if(state.shared.length)bot(`（已同步提醒：${state.shared.map(esc).join("、")}）`);try{navigator.vibrate&&navigator.vibrate([150,80,150])}catch(e){}}}
    if(t.st==="c"){const sig=t.id+":"+(t.ct||0)+":"+(t.rc||0);if(sig!==state.calledSig){const re=!!state.calledSig&&state.calledSig.split(":")[0]===t.id;state.calledSig=sig;save();bot(re?"櫃台還在等你喔～到了跟櫃台說一聲就好 🙂":"到你了！🙌 慢慢走過來就好，櫃台已經看過你的需求、準備好了。");bot(calledCard(t,re?"再次提醒":"輪到你了"));if(!re&&state.shared.length)bot(`（已同步通知：${state.shared.map(esc).join("、")}）`);announce(t.no,t.desk||1)}}
    if(t.st==="d"&&!state.doneShown){state.doneShown=true;state.lastDone=t.id;save();bot("辛苦了！今天的事都辦好了 🎉 花 10 秒幫櫃台打個分數，讓我們做得更好。");bot(doneCard(t))}
    if(t.st==="s"&&!state.notified.skip){state.notified.skip=1;save();bot(`😢 ${t.no} 已過號。櫃台叫號時沒有等到你。\n可以重新取號，或直接洽櫃台人員。`)}
  }
  liveButtons();
}

/* ---------- 模擬隊伍（示範模式，或選了還沒接系統的門市） ---------- */
let demo={tickets:{},seq:0,timer:null};
function demoView(){VD=Q.view({meta:{store:state.tkStore||myStore()},tickets:demo.tickets});if(state.bindNo){const m=VD.all.find(x=>x.id===state.myId);if(m)m.no=state.bindNo}onData()}
function demoSeed(n){demo.tickets={};clearInterval(demo.timer);const k=Math.min(6,Math.max(2,Math.round(storeMins(n)/5))),base=Date.now()-600000,cs=Object.keys(CATS);
  for(let i=0;i<k;i++)demo.tickets["-d"+(++demo.seq+100)]={cat:cs[(i*3+1)%4],st:i===0?"c":"w",desk:1,ct:base+i,t:base+i*1000};VD=Q.view({tickets:demo.tickets})}
function demoTake(text,n){demoSeed(n);const id="-d"+(++demo.seq+100);demo.tickets[id]={cat:F.cat,st:"w",t:Date.now(),src:"line",p:F.p||undefined};state.myId=id;save();VD=Q.view({meta:{store:n},tickets:demo.tickets});demoRun()}
function demoHold(){const p=Q.holdPatch(VD,state.myId,2);Object.assign(demo.tickets[state.myId],p);if(demo.tickets[state.myId].desk===null)delete demo.tickets[state.myId].desk;demoView()}
function demoRun(){clearInterval(demo.timer);demo.timer=setInterval(()=>{   // 每 6 秒櫃台叫下一位
  const cur=Object.entries(demo.tickets).find(([,t])=>t.st==="c");if(cur){cur[1].st="d"}
  const v=Q.view({tickets:demo.tickets}),nx=v.waiting[0];if(nx){demo.tickets[nx.id].st="c";demo.tickets[nx.id].desk=1+(demo.seq%3);demo.tickets[nx.id].ct=Date.now()}
  demoView();const m=demo.tickets[state.myId];if(!m||m.st==="d"||!nx)clearInterval(demo.timer)},window.QT_DEMO_MS||6000)}

/* ---------- 啟動 ---------- */
function setStatus(s){const el=$("#st");el.className=s==="live"?"ok":s==="connecting"||s==="reconnecting"?"":"bad";el.lastElementChild.textContent=s==="live"?`已連上 ${liveStore}・自動回覆訊息中`:(Q.STATUS_ZH[s]||s)}
drawMenu();
/* 從叫號說 App（免登入）帶號碼過來：#l=…&t=<ticketId>（現場）或 ?bind=A118&ahead=3（示範） */
const BIND=(()=>{try{const h=location.hash,q=new URLSearchParams(location.search),t=(h.match(/[&#]t=([^&]+)/)||[])[1];
  if(t)return {id:decodeURIComponent(t)};if(q.get("bind"))return {no:q.get("bind"),ahead:Math.max(0,+q.get("ahead")||0),cat:q.get("cat")||"繳費/儲值",store:q.get("store")||"台北文創門市",pk:(q.get("pk")||"").split(",").filter(Boolean),cp:(q.get("cp")||"").split(",").filter(Boolean)}}catch(e){}return null})();
function adoptLive(room){if(!BIND||!BIND.id||state.myId===BIND.id)return;const t=Q.view(room).all.find(x=>x.id===BIND.id);if(!t||!active(t))return;
  state.myId=t.id;state.tkLive=true;state.tkStore=liveStore;state.store=liveStore;state.notified={};state.calledSig=null;state.doneShown=false;save();
  bot(`歡迎加入 👋 已經幫你把叫號說的號碼 <b>${t.no}</b> 接過來了，不用重新取號。\n之後輪到你，我會在這裡通知你。`);setTimeout(()=>{VL=Q.view(room);const m=mine();if(m)bot(m.st==="c"?calledCard(m,"輪到你了"):ticketCard(m,"你的號碼"))},50)}
function adoptDemo(){if(!BIND||!BIND.no)return;state.store=BIND.store;state.tkStore=BIND.store;state.tkLive=false;state.bindNo=BIND.no;
  demo.tickets={};const base=Date.now()-600000,cs=Object.keys(CATS);
  for(let i=0;i<=BIND.ahead;i++)demo.tickets["-d"+(++demo.seq+100)]={cat:cs[(i*3+1)%4],st:i===0?"c":"w",desk:1,ct:base+i,t:base+i*1000};
  const id="-d"+(++demo.seq+100);demo.tickets[id]={cat:CATS[BIND.cat]?BIND.cat:"繳費/儲值",st:"w",t:Date.now(),src:"app",pk:BIND.pk,cp:BIND.cp};state.myId=id;
  demoView();bot(`歡迎加入 👋 已經幫你把叫號說的號碼 <b>${BIND.no}</b> 接過來了，不用重新取號。\n之後輪到你，我會在這裡通知你。`);const t=mine();if(t)bot(ticketCard(t,"你的號碼"));demoRun();
  try{history.replaceState(null,"",location.pathname)}catch(e){}}
function welcome(){bot(`歡迎加入台灣大哥大 Open Possible 👋\n🆕 現在可以直接在官方帳號線上取號：\n① 點下方「用戶服務 › 門市取號」\n② 選門市，用一句話說說你要辦什麼\n輪到你時，我們會在這裡傳訊息叫你；辦完還可以幫櫃台打個分數。`)}
if(decided){welcome();if(DEMO)adoptDemo()}else setTimeout(()=>decide(null),3000);
if(DEMO){$("#mock").textContent="概念示意・示範模式（沒有連線，櫃台每 6 秒自動叫下一位）"}
else{conn=Q.connect(sess.host,sess.room,room=>{decide(room);adoptLive(room);VL=Q.view(room);if(VL.meta&&VL.meta.store)liveStore=VL.meta.store;if(state.tkLive)onData();draw(false)},setStatus)}
draw(true);
</script>
<script id="qt-lock">
/* 手機上鎖住畫面：只讓聊天室與取號畫面捲動，避免整頁（或 App 內瀏覽器）被拖動 */
(function(){if(!("ontouchstart" in window))return;var sy=0;
document.addEventListener("touchstart",function(e){if(e.touches.length===1)sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchmove",function(e){if(e.touches.length>1){e.preventDefault();return}var dy=e.touches[0].clientY-sy,el=e.target;
  while(el&&el.nodeType===1&&el!==document.body){var cs=getComputedStyle(el);if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+1){if((dy>0&&el.scrollTop<=0)||(dy<0&&el.scrollTop+el.clientHeight>=el.scrollHeight-1))e.preventDefault();return}
    if(/(auto|scroll)/.test(cs.overflowX)&&el.scrollWidth>el.clientWidth+1)return;el=el.parentElement}
  e.preventDefault()},{passive:false});})();
</script>
