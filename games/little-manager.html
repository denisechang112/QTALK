<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body><style id="qt-noscroll">html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}</style><title>小小店長</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--sky:#3a4fd6;--ink:#15142a;--paper:#fffaf0;--cream:#fdf0d2;--orange:#f2711c;--yellow:#ffcf2e;--green:#3ec46d;--red:#e8402f;--lilac:#b9bff2;--muted:#5a5c78;--card:#fffaf0;--text:#15142a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#26338f;--card:#24244a;--text:#fffaf0;--muted:#c4c6e0;--cream:#33325c}}
:root[data-theme="dark"]{--sky:#26338f;--card:#24244a;--text:#fffaf0;--muted:#c4c6e0;--cream:#33325c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--sky);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:17px;line-height:1.5;background-image:radial-gradient(rgba(255,255,255,.09) 2px,transparent 2.5px);background-size:22px 22px;overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;animation:fin .35s ease}.scr.on{display:flex}
@keyframes fin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;color:#fff}
.icon-btn{border:3px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font-size:19px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-family:inherit;font-weight:900;padding:0 10px}
.icon-btn:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn{display:block;width:100%;border:4px solid var(--ink);border-radius:16px;padding:13px 16px;font:900 21px "Noto Sans TC",sans-serif;box-shadow:5px 5px 0 var(--ink);cursor:pointer;color:var(--ink);background:var(--yellow);letter-spacing:.04em}
.btn.o{background:var(--orange);color:#fff}.btn.w{background:var(--paper)}
.btn small{display:block;font-size:14px;font-weight:700}
.badge{display:inline-block;background:var(--ink);color:var(--yellow);border-radius:999px;padding:2px 12px;font-weight:900;font-size:14px;white-space:nowrap}
.panel{background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:5px 5px 0 var(--ink);margin-bottom:14px}
.muted{color:var(--muted);font-weight:700;font-size:15px}
h2.head{color:#fff;font:900 28px "Noto Sans TC";margin:4px 0 12px;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.stack{display:grid;gap:12px;margin-top:auto}
.logo{text-align:center;color:#fff}
.shout{display:inline-block;background:var(--orange);color:#fff;border:4px solid var(--ink);padding:4px 14px;font:900 16px "Noto Sans TC";transform:rotate(-3deg);box-shadow:4px 4px 0 var(--ink);letter-spacing:.06em}
.logo h1{font:900 52px/1.05 "Noto Sans TC";margin:12px 0 2px;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);letter-spacing:.06em}
.logo p{margin:0;font-weight:700}
/* clerk picker */
.picker{display:flex;align-items:center;gap:8px;margin:14px 0 12px}
.picker .stage{flex:1;background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:8px 10px 10px;display:flex;align-items:center;gap:10px;min-height:170px;position:relative}
.picker .stage .pic{width:110px;flex:none;display:flex;justify-content:center;animation:bob 2s ease-in-out infinite}
.picker .stage b{font-size:22px;display:block}
.picker .stage .w{display:inline-block;background:var(--cream);border:2.5px solid var(--ink);border-radius:10px;padding:0 8px;font-weight:900;font-size:14px;margin:4px 0}
.picker .stage .lock{position:absolute;inset:0;background:rgba(21,20,42,.55);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;text-align:center}
.picker .arrow{min-width:40px;height:56px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid var(--ink)}.dots i.on{background:var(--yellow)}
.toggle{display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:900;margin:0 4px 12px}
.sw{position:relative;width:54px;height:30px}.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;background:rgba(255,255,255,.35);border:3px solid var(--ink);border-radius:999px}.sw i:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:.2s}.sw input:checked+i{background:var(--green)}.sw input:checked+i:after{left:26px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* game */
#game{position:fixed;inset:0;display:none;background:#2d2f4a;z-index:5;touch-action:none}
#game.on{display:block}
#cv{position:absolute;left:50%;top:0;transform:translateX(-50%);height:100%;touch-action:none}
.ghud{position:absolute;left:50%;transform:translateX(-50%);top:0;width:min(100%,520px);padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none;color:#fff;font-weight:900}
.ghud .r1{display:flex;align-items:center;gap:8px}
.ghud .clock{flex:1;min-width:0;text-align:center;font:900 20px "Archivo Black";-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.ghud .chip{background:rgba(21,20,42,.85);border-radius:999px;padding:2px 8px;font-size:13px;white-space:nowrap}
.ghud .pause{pointer-events:auto}
.bars{margin-top:6px;display:grid;gap:4px}
.bar{height:12px;border:2.5px solid var(--ink);border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0}
.bar.hp i{background:var(--red)}.bar.xp i{background:#6dc7e6}
.bar span{position:absolute;right:6px;top:-4px;font-size:11px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.goal{display:inline-block;margin-top:5px;background:rgba(21,20,42,.88);border-radius:999px;padding:1px 10px;font-size:13px}.goal.ok{background:var(--green)}
.slots{display:flex;gap:4px;margin-top:6px}.slots span{background:rgba(21,20,42,.85);border-radius:8px;padding:0 6px;font-size:13px}
.banner{position:absolute;left:50%;top:32%;transform:translateX(-50%);width:min(92%,440px);text-align:center;pointer-events:none;display:none}
.banner.on{display:block;animation:pop .35s cubic-bezier(.3,1.5,.6,1)}
.banner b{display:inline-block;font:900 30px "Noto Sans TC";color:var(--yellow);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.banner div{margin-top:6px;background:rgba(21,20,42,.88);color:#fff;border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px}
.modal{position:absolute;inset:0;background:rgba(10,10,30,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:3}
.modal.on{display:flex}
.modal .in{width:min(100%,440px);animation:pop .3s}
.modal h3{color:#fff;text-align:center;font:900 30px "Noto Sans TC";margin:0 0 10px;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
.opt{display:flex;gap:12px;align-items:center;width:100%;background:var(--card);color:var(--text);border:4px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:10px 12px;margin-bottom:12px;font:inherit;text-align:left;cursor:pointer}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt .ic{font-size:30px;flex:none;width:54px;height:54px;display:grid;place-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:12px}
.opt b{display:block;font-size:17px}.opt span{display:block;font-size:14px;color:var(--muted);font-weight:700;line-height:1.35}
.opt .lv{margin-left:auto;flex:none;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:0 8px;font-weight:900;font-size:13px;white-space:nowrap}
.opt .lv.new{background:var(--green);color:#fff}.opt .lv.aw{background:var(--orange);color:#fff}
/* results / shop / album */
.big{font:900 42px "Noto Sans TC";color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);text-align:center;line-height:1.1;margin:4px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--cream);border:3px solid var(--ink);border-radius:12px;padding:6px 10px}
.stats b{display:block;font:900 22px "Archivo Black"}
.stats span{font-size:13px;font-weight:700;color:var(--muted)}
.upg{display:flex;gap:12px;align-items:center;background:var(--card);border:4px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:10px 12px;margin-bottom:12px;width:100%;font:inherit;color:var(--text);text-align:left;cursor:pointer}
.upg .ic{font-size:30px;flex:none;width:52px;height:52px;display:grid;place-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:12px}
.upg b{display:block;font-size:17px}.upg span{display:block;font-size:14px;color:var(--muted);font-weight:700;line-height:1.35}
.upg .price{margin-left:auto;flex:none;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:900;white-space:nowrap}
.upg.max{opacity:.6}.upg.max .price{background:var(--green);color:#fff}.upg.poor .price{background:#ddd;color:#888}
.upg .pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.pips i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:#fff}.pips i.on{background:var(--orange)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font:900 15px "Noto Sans TC";padding:6px 0;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.tabs button.on{background:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.card{background:var(--card);border:3.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:6px 4px 8px;text-align:center;font:inherit;color:var(--text);cursor:pointer;position:relative}
.card .pic{height:92px;display:flex;justify-content:center;align-items:flex-end}
.card .pic canvas{max-width:100%}
.card .nm{font-weight:900;font-size:13px;line-height:1.25;margin-top:4px}
.card .job{font-size:11px;color:var(--muted);font-weight:700}
.card.locked .pic>*{filter:brightness(0);opacity:.3}
.medal{display:flex;gap:10px;align-items:center;background:var(--card);border:3.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:8px 12px;margin-bottom:10px}
.medal .ic{font-size:30px}.medal b{display:block}.medal span{font-size:14px;color:var(--muted);font-weight:700}
.medal.locked{opacity:.5}.medal.locked .ic{filter:grayscale(1)}
.sheet{position:fixed;inset:0;background:rgba(10,10,30,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.sheet.on{display:flex}
.sheet .in{background:var(--card);color:var(--text);border:4px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);max-width:420px;width:100%;padding:16px;animation:pop .3s}
.sheet h3{margin:0 0 4px;font-size:23px}
.tipbox{background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 10px;font-weight:900;margin:10px 0}
.toast{position:fixed;left:50%;bottom:max(90px,calc(env(safe-area-inset-bottom) + 80px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-weight:900;z-index:50;display:none;max-width:90vw;text-align:center}
.store-btn{border:3px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:12px;height:40px;font:700 14px "Noto Sans TC";box-shadow:3px 3px 0 var(--ink);padding:0 10px;cursor:pointer;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.menu>*{border:3px solid var(--ink);background:#1b2470;color:#fff;border-radius:10px;font:900 13px "Noto Sans TC";padding:8px 2px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;text-align:center;text-decoration:none;white-space:nowrap}
.menu>*:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.menu .hot{background:var(--red);border-color:var(--yellow);box-shadow:3px 3px 0 var(--ink),0 0 0 2px var(--ink)}
.who-h{color:#fff;font-weight:900;font-size:18px;margin:10px 0 6px}
.clerks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.clerks button{aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:var(--cream);padding:3px 0 0;cursor:pointer;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;position:relative}
.clerks button.on{border-color:#6dc7e6;box-shadow:0 0 0 3px #6dc7e6}
.clerks button.lock svg{filter:brightness(0);opacity:.35}
.clerks button .lk{position:absolute;top:2px;right:3px;font-size:12px}
.clerks button.soon{background:rgba(255,255,255,.2);border-style:dashed;align-items:center;color:#fff;font-weight:900}
.detail{background:#1b2470;color:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;margin-bottom:12px}
.detail .floor{height:118px;display:flex;justify-content:center;align-items:flex-end;background:#c8b9a0;background-image:linear-gradient(135deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%),linear-gradient(#a8977c 2px,transparent 2px),linear-gradient(90deg,#a8977c 2px,transparent 2px);background-size:56px 56px,56px 56px,56px 56px;border-bottom:4px solid var(--ink);position:relative}
.detail .floor .pic{animation:bob 2s ease-in-out infinite;margin-bottom:4px}
.detail .floor .lockm{position:absolute;inset:0;background:rgba(21,20,42,.55);display:flex;align-items:center;justify-content:center;font-weight:900;text-align:center}
.detail .in{padding:8px 14px 12px}
.detail h3{margin:0;text-align:center;color:#6dc7e6;font:900 28px "Noto Sans TC";letter-spacing:.1em}
.detail .st{display:flex;justify-content:center;gap:24px;font-weight:700;margin-bottom:6px}
.detail .sec{border-top:2px solid rgba(255,255,255,.25);padding:6px 0;font-weight:700;font-size:15px;line-height:1.55}
.detail .sec .k{color:#6dc7e6}
.detail .sec.note{color:var(--yellow);font-size:13px}
.board{background:#1b2470;color:#fff;border:4px solid var(--yellow);border-radius:14px;padding:10px 14px;margin-top:14px;box-shadow:4px 4px 0 var(--ink)}
.board b{color:var(--yellow)}
.board ol{margin:6px 0 2px;padding-left:22px;font-weight:700;font-size:15px}
.board li{display:flex;justify-content:space-between;gap:8px}.board li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li.me{color:var(--yellow)}
.board .hint2{font-size:13px;opacity:.8}
.rk{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed rgba(90,92,120,.3);font-weight:700}
.rk:last-child{border:none}
.rk .no{width:30px;font:900 18px "Archivo Black";text-align:center}
.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm small{display:block;color:var(--muted);font-size:12px}
.rk .sc{font:900 17px "Archivo Black"}
.rk.me{background:var(--yellow);color:var(--ink);border-radius:10px;padding:6px 8px}
textarea{width:100%;border:3px solid var(--ink);border-radius:12px;padding:8px;font:700 13px ui-monospace,monospace;background:#fff;color:#15142a;resize:vertical;word-break:break-all}
.rules ol{margin:0;padding-left:22px;font-weight:700}.rules li{margin:6px 0}.rules h4{margin:12px 0 4px}
.tut{text-align:center;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tut .ill{font-size:64px;line-height:1.1;min-height:120px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.tut h3{margin:10px 0 6px;font-size:24px}
.tut p{margin:0;font-weight:700;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

$("#offBtn").onclick=()=>{if(!G||G.over||!G.goalDone)return;SFX.tap();endRun(true,false,"early")};
$("#pause").onclick=()=>{if(!G||G.over||G.paused)return;SFX.tap();G.paused=true;

 $("#modal").classList.add("on");musStop();$("#pMus").onclick=()=>{MUS.on=!MUS.on;try{localStorage.setItem("littleManagerMusic",JSON.stringify(MUS.on))}catch(e){}musBtn();$("#pMus").textContent=MUS.on?"🔕 關閉音樂":"🎵 開啟音樂"};$("#pRes").onclick=()=>{$("#modal").classList.remove("on");G.paused=false;last=performance.now();musPlay(G.boss?"boss":"play")};$("#pQuit").onclick=()=>{$("#modal").classList.remove("on");endRun(!!G.goalDone,true,G.goalDone?"early":"quit")}};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G&&!G.over&&!G.paused)$("#pause").click()});
function endRun(win,quit,why){if(G.over)return;G.over=true;cancelAnimationFrame(raf);musStop();$("#toast").style.display="none";
 const score=scoreOf(G,win);SAVE.scores=(SAVE.scores||[]).concat([{s:score,ck:G.ck.id,st:G.store,d:Date.now(),w:win?1:0}]).sort((a,b)=>b.s-a.s).slice(0,10);
 const GG=curStoreRun(G).goal;let stars=0;if(win){stars=1+(G.combo>=3?1:0)+(G.checked>=Math.ceil(GG.cust*1.3)?1:0);SAVE.stars=SAVE.stars||[0,0,0];const before=starTotal();SAVE.stars[G.store]=Math.max(SAVE.stars[G.store]||0,stars);if(before<9&&starTotal()>=9){SAVE.clerks.includes("jiao")||SAVE.clerks.push("jiao");G.unlockClerk=1}}
 if(win){SAVE.storeWins=SAVE.storeWins||[];if(!SAVE.storeWins.includes(G.store)){SAVE.storeWins.push(G.store);if(STORES[G.store+1])G.unlockStore=STORES[G.store+1].n}}
 submitScore(score,G.ck.id,G.store);
 SAVE.coins+=G.coins;SAVE.res+=G.rescued;SAVE.runs++;if(win)SAVE.wins++;medal("first");if(win)medal("win");if(SAVE.res>=50)medal("res50");persist();
 setTimeout(()=>{$("#game").classList.remove("on");
  $("#eTag").textContent=G.ck.n+"・"+curStoreRun(G).n+(G.easy?"・輕鬆":"");
  $("#eTitle").innerHTML=(why==="early"?"🌙 達標下班！":why==="deadok"?"🎉 營業目標達成！":quit?"提早下班":"體力耗盡…")+(why==="deadok"?`<div style="font-size:15px;color:#fff;-webkit-text-stroke:0;text-shadow:none">體力耗盡，自動下班（已達標，算過關）</div>`:"")+(win?`<div style="font-size:38px;color:var(--yellow);letter-spacing:4px">${starStr(stars)}</div>`:(why==="dead"||why==="quit")?`<div style="font-size:15px;color:#fff;-webkit-text-stroke:0;text-shadow:none">營業目標還差：${G.checked<GG.cust?`結帳 ${GG.cust-G.checked} 位 `:""}${GG.boss&&G.bossDone.length<GG.boss?`魔王 ${GG.boss-G.bossDone.length} 個`:""}</div>`:"")+`<div style="font:900 22px 'Archivo Black';color:#fff;-webkit-text-stroke:0;text-shadow:none;margin-top:6px">SCORE ${score.toLocaleString()}</div>`+(G.unlockStore?`<div style="font-size:16px;color:#fff;-webkit-text-stroke:0;text-shadow:none">🏬 新分店開放：${G.unlockStore}</div>`:"")+(G.unlockClerk?`<div style="font-size:16px;color:#fff;-webkit-text-stroke:0;text-shadow:none">⭐ 集滿 9 顆星！隱藏店員「Duck」加入</div>`:"")+(win?`<div style="font-size:13px;color:#fff;-webkit-text-stroke:0;text-shadow:none;font-weight:700">★ 達標　★ 叫號連發 3 次（${G.combo}）　★ 結帳 ${Math.ceil(GG.cust*1.3)} 位（${G.checked}）</div>`:"");
  const mm=Math.floor(G.t/60),ss=Math.floor(G.t%60);
  $("#eStats").innerHTML=`<div><b>${mm}:${String(ss).padStart(2,"0")}</b><span>上班時間</span></div><div><b>Lv${G.lv}</b><span>等級</span></div><div><b>${G.kills}</b><span>打倒詐騙怪</span></div><div><b>${G.rescued}</b><span>救出顧客</span></div><div><b>${G.checked}</b><span>櫃台結帳</span></div><div><b>+${G.coins}</b><span>這次收入（已存入）</span></div>`;
  const nm=(G.newMedals||[]).map(id=>MEDALS.find(m=>m.id===id)),nc=G.newCust.length,nmon=G.newMon.length;
  if(nm.length||nc||nmon){$("#eNew").style.display="";$("#eNew").innerHTML=`<b>🎉 新收集</b><div class="muted">${nc?`顧客 ${nc} 位・`:""}${nmon?`詐騙怪 ${nmon} 種・`:""}勳章 ${nm.length} 枚</div>${nm.map(m=>`<div style="font-weight:900;margin-top:4px">${m.ic} ${m.n}</div>`).join("")}`}else $("#eNew").style.display="none";
  show("s-end");jingle(win)},win?400:700);
}

function renderShop(){

 const items=SHOP.map(u=>{const l=upLv(u.id),max=l>=u.max,cost=u.cost[l];return `<button class="upg${max?" max":""}${!max&&SAVE.coins<cost?" poor":""}" data-u="${u.id}"><span class="ic">${u.ic}</span><span><b>${u.t}<span class="pips">${Array(u.max).fill(0).map((_,i)=>`<i class="${i<l?"on":""}"></i>`).join("")}</span></b><span>${u.d}</span></span><span class="price">${max?"已滿級":MOI+cost}</span></button>`}).join("");
 const ck=CLERKS.filter(c=>c.cost).map(c=>{const own=SAVE.clerks.includes(c.id);return `<button class="upg${own?" max":""}${!own&&SAVE.coins<c.cost?" poor":""}" data-c="${c.id}"><span class="ic" style="overflow:hidden;align-items:end">${svgOf(c.c,40)}</span><span><b>店員：${c.n}</b><span>${WEAP[c.w].ic} 起始武器 ${WEAP[c.w].n}・${c.pv[0]}</span></span><span class="price">${own?"已加入":MOI+c.cost}</span></button>`}).join("");

<script id="qt-lock">/* 手機上鎖住畫面：手指拖曳時，只讓真的能捲的區塊捲動，其他一律不讓整頁（或 App 內瀏覽器的視窗）跟著移動 */
(function(){if(!("ontouchstart" in window))return;var sx=0,sy=0;
function scrollable(el,axis){var cs=getComputedStyle(el),o=axis==="y"?cs.overflowY:cs.overflowX;
  return /(auto|scroll)/.test(o)&&(axis==="y"?el.scrollHeight>el.clientHeight+1:el.scrollWidth>el.clientWidth+1)}
document.addEventListener("touchstart",function(e){if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener("touchmove",function(e){if(e.touches.length>1){e.preventDefault();return}
  var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy,axis=Math.abs(dx)>Math.abs(dy)?"x":"y",el=e.target;
  for(var a=el;a&&a.nodeType===1;a=a.parentElement){if(getComputedStyle(a).touchAction==="none"){e.preventDefault();return}}
  while(el&&el.nodeType===1&&el!==document.body&&el!==document.documentElement){
    if(scrollable(el,axis)){
      if(axis==="y"){if(dy>0&&el.scrollTop<=0){e.preventDefault()}else if(dy<0&&el.scrollTop+el.clientHeight>=el.scrollHeight-1){e.preventDefault()}}
      return}
    el=el.parentElement}
  /* 整頁本身可以捲（例如遊戲選單）：照常捲，只擋住最上方往下拉、最下方往上推 */
  var se=document.scrollingElement||document.documentElement,hb=getComputedStyle(document.body).overflowY,hh=getComputedStyle(document.documentElement).overflowY;
  if(axis==="y"&&hb!=="hidden"&&hh!=="hidden"&&se.scrollHeight>window.innerHeight+1){
    if(dy>0&&se.scrollTop<=0)e.preventDefault();else if(dy<0&&se.scrollTop+window.innerHeight>=se.scrollHeight-1)e.preventDefault();
    return}
  e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",function(e){e.preventDefault()},{passive:false});
})();
</script>
